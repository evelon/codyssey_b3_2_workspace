[project]
name = "gitscribe"
version = "0.1.0"
description = "git diff를 분석해 AI로 커밋 메시지와 PR 초안을 자동 생성하는 Python CLI 도구"
readme = "README.md"
authors = [
    { name = "Jonghyun Lim", email = "ezemango@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
gitscribe = "gitscribe:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
